<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="viewFolder.css">
</head>
<body>
    <div class="file-viewer-dialog">
    <h2>Files in Folder</h2>
    <div class="file-table">
        <div class="file-row file-header">
            <div class="file-icon">Icon</div>
            <div class="file-name">File Name</div>
            <div class="file-date">Date Created</div>
            <div class="file-size">Size</div>
            <div class="file-uploaded-by">Uploaded By</div>
            <div class="file-actions">Actions</div>
        </div>
        <div class="file-row">
            <div class="file-icon"><i class="fas fa-file"></i></div>
            <div class="file-name">Document.pdf</div>
            <div class="file-date">2024-08-27</div>
            <div class="file-size">1.5 MB</div>
            <div class="file-uploaded-by">John Doe</div>
            <div class="file-actions">
                <button class="action-btn delete">Delete</button>
                <button class="action-btn download">Download</button>
                <button class="action-btn share">Share</button>
                <button class="action-btn move">Move</button>
            </div>
        </div>
        <!-- Add more file rows as needed -->
    </div>
    <div class="dialog-footer">
        <button id="closeDialog">Close</button>
    </div>
</div>
<script src="viewFolder.html" defer></script>
</body>
</html>
