<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Files to users</title>
   <link rel="stylesheet" href="shareFiles.css"> 
</head>
<body>
    <div class="shareFilesBox">
        <h2>Share Your Files to users</h2>
        <div class="text_Box">
            <h3>Select files and The Users to share the files with</h3>

        </div>
        <div class="thisContainer">
            <h4>Files To Share</h4>
            <div class="file_box">
                <div class="file_item">
                    file1.jpg
                </div>
            </div>
            <div class="addBox">
                <button>Add Files</button>
            </div>
        </div>
        
        <div class="thisContainer">
            <h4>Recipients</h4>
            <div class="users_box">
                <div class="user_item">
                    AW
                </div>
            </div>
            <div class="addBox">
                <button>Add users</button>
            </div>
        </div>
    </div>
</body>
</html>
