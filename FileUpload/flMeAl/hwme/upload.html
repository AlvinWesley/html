<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your File here</title>
    <link rel="stylesheet" href="upload.css">
</head>
<body>
    <div class="bg">
        <div class="mid">
            <div class="upper">
                <div class="dropBox">
                    <p> Click or drop to add file</p>
                </div>
                
            </div>
            <div class="middle">
                 <div class="f_icon"> icon here</div>
                <div class="fileBox">
                   <div class="items">
                        <div class="f_name">name here</div>
                        <div class="f_manip">
                            <button type="button">delete</button>
                            <button type="button">view</button>
                            
                        </div>
                   </div>
                    <div class="prog">
                            <div class="prog_bar"></div>
                            <div class="Prog_promt">10% complete</div>
                    <!-- progressbar here -->
                    </div>
                    
                    <form action="#" id="itemDescription">
                                <input type="text" name="descr" id="a_descr" placeholder="add A description">
                            </form>
                </div>
                
            </div>
            <div class="lower">
                <button type="submit">Add File</button>
                <button type="submit">Submit</button> 
                 <button type="submit">Clear</button>
                <button type="submit">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
