<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload UI</title>
    <link rel="stylesheet" href="file.css">
</head>
<body>

    <div class="upload-container">
        <div class="upload-box">
            <p>Click or drop to add file</p>
            <div class="upload-icon">+</div>
        </div>

        <div class="file-item">
            <div class="file-details">
                <span class="file-icon">📄</span>
                <span class="file-name">Document 1 .pdf .....Uploading</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="file-actions">
                <button class="btn-delete">✖</button>
            </div>
        </div>

        <div class="file-item">
            <div class="file-details">
                <span class="file-icon">📄</span>
                <span class="file-name">Document 2.pdf</span>
            </div>
            <div class="file-actions">
                <button class="btn-edit">✏️</button>
                <button class="btn-view">👁️</button>
                <button class="btn-delete">✖</button>
            </div>
        </div>

        <div class="file-item">
            <div class="file-details">
                <span class="file-icon">🖼️</span>
                <span class="file-name">Document 3.jpeg</span>
            </div>
            <div class="file-actions">
                <button class="btn-edit">✏️</button>
                <button class="btn-view">👁️</button>
                <button class="btn-delete">✖</button>
            </div>
        </div>

        <button class="btn-submit">Submit</button>
    </div>

</body>
</html>
